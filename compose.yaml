services:
  flex-direct:
    build: .
    restart: unless-stopped
    ports:
      - "8789:8080"
      - "${DISCOVERY_LISTEN_PUBLISH:-10002}:${DISCOVERY_LISTEN_PORT:-10001}/udp"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no ficheiro .env}
      INFORM_URL: ${INFORM_URL:?Defina INFORM_URL no ficheiro .env}
      SWITCH_MAC: ${SWITCH_MAC:-}
      AUTO_ADOPT: ${AUTO_ADOPT:-0}
      BOOTSTRAP_KEY_FILE: ${BOOTSTRAP_KEY_FILE:-}
      DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-0}
      DISCOVERY_TARGETS: ${DISCOVERY_TARGETS:-}
      DISCOVERY_INTERVAL_MS: ${DISCOVERY_INTERVAL_MS:-30000}
      DISCOVERY_LISTEN_ENABLED: ${DISCOVERY_LISTEN_ENABLED:-0}
      DISCOVERY_LISTEN_PORT: ${DISCOVERY_LISTEN_PORT:-10001}
      RECOVERY_SAVED_ADDRESS_DELAY_MS: ${RECOVERY_SAVED_ADDRESS_DELAY_MS:-12000}
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
